name: Build HT Portfolio AI 30 Plus APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'HTPortfolioAI30Plus_OneUpload.zip'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack one-upload project if present
        shell: bash
        run: |
          if [ -f 'HTPortfolioAI30Plus_OneUpload.zip' ]; then
            unzip -oq 'HTPortfolioAI30Plus_OneUpload.zip' -d .
          fi
          test -f app/build.gradle
          test -f app/src/main/java/com/htportfolio/ai/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Ubuntu runner includes the Android SDK. Avoid
      # android-actions/setup-android@v3, which is failing during SDK setup.
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo 'Android SDK directory not found' >&2; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found: $SDKMANAGER" >&2; exit 1; }
          "$SDKMANAGER" --version
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -d "$SDK/build-tools/35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test portfolio and insurance mathematics
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTPortfolioAI30Plus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
