name: Build HT Portfolio AI 30 Plus APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'HTPortfolioAI30Plus_OneUpload.zip'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack one-upload project if present
        shell: bash
        run: |
          if [ -f 'HTPortfolioAI30Plus_OneUpload.zip' ]; then
            unzip -oq 'HTPortfolioAI30Plus_OneUpload.zip' -d .
          fi
          test -f app/build.gradle
          test -f app/src/main/java/com/htportfolio/ai/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test portfolio and insurance mathematics
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTPortfolioAI30Plus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
